# Production stack for Dokploy / reverse proxy.
# No host port binds — Traefik/Dokploy reaches services on the Docker network.
# Domain tips:
#   - web: service `web`, port 3000  (one public domain is enough)
#   - api: optional service `api`, port 3001  (only if you want a separate API host)
# Prefer same-origin: proxy /api and /socket.io to `api:3001` from the web domain.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carrera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carrera}
      POSTGRES_DB: ${POSTGRES_DB:-carrera}
    volumes:
      - carrera_prod_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carrera} -d ${POSTGRES_DB:-carrera}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-carrera}:${POSTGRES_PASSWORD:-carrera}@db:5432/${POSTGRES_DB:-carrera}?schema=public
      JWT_WS_SECRET: ${JWT_WS_SECRET:-change-me-in-prod}
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io}
      FINISH_RADIUS_M: ${FINISH_RADIUS_M:-80}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - api
    expose:
      - "3000"

volumes:
  carrera_prod_db:
