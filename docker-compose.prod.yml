# Production-style stack. Host ports ONLY on loopback.
# Public access: reverse proxy / Dokploy domain → web :3000
# Proxy must also route /api and /socket.io to api :3001 (or set NEXT_PUBLIC_API_URL).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carrera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-carrera}
    volumes:
      - carrera_prod_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carrera} -d ${POSTGRES_DB:-carrera}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # no public ports — only Docker network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-carrera}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-carrera}?schema=public
      JWT_WS_SECRET: ${JWT_WS_SECRET:?set JWT_WS_SECRET}
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:3000}
      PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io}
      FINISH_RADIUS_M: ${FINISH_RADIUS_M:-80}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    expose:
      - "3001"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        # baked at build if needed
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"

volumes:
  carrera_prod_db:
