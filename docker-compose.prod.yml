# Production stack for Dokploy.
# Unique service names avoid Docker DNS collisions with other projects on the same host.
#
# Domain: only need carrera.alore.dev → service carrera_web :3000
# Next rewrites /api and /socket.io to carrera_api:3001 on the compose network.

services:
  carrera_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - carrera_prod_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  carrera_api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@carrera_db:5432/${POSTGRES_DB}?schema=public
      JWT_WS_SECRET: ${JWT_WS_SECRET}
      PORT: "3001"
      CORS_ORIGIN: ${CORS_ORIGIN}
      PHOTON_URL: ${PHOTON_URL:-https://photon.komoot.io}
      FINISH_RADIUS_M: ${FINISH_RADIUS_M:-80}
      NODE_ENV: production
    depends_on:
      carrera_db:
        condition: service_healthy
    expose:
      - "3001"

  carrera_web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://carrera_api:3001
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - carrera_api
    expose:
      - "3000"

volumes:
  carrera_prod_db:
