# Local development DB only.
# Requires POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB in the environment
# (e.g. export them or use a root .env that docker compose loads — never commit secrets).

services:
  db:
    image: postgres:16-alpine
    container_name: carrera-de-tiempo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - carrera_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carrera_db_data:
