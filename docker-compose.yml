services:
  db:
    image: postgres:16-alpine
    container_name: carrera-de-tiempo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carrera
      POSTGRES_PASSWORD: carrera
      POSTGRES_DB: carrera
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - carrera_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrera -d carrera"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carrera_db_data:
